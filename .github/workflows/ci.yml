# Continuous verification. In order:
#   1. the frozen statement's SHA-256 (scripts/check_statement.py)
#   2. the trust-shortcut scan (scripts/trust_scan.sh)
#   3. install the pinned toolchain; fetch the Mathlib cache
#   4. `lake build --wfail` (any warning fails)
#   5. the silent kernel audit of headline types and proof-step axioms
#   6. `lake env leanchecker NaturalLatents.Main` (kernel replay of both headlines)
# Nothing here runs `lake update` or changes a pin.

name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - name: Check the frozen statement
        run: python3 scripts/check_statement.py

      - name: Scan for trust shortcuts
        shell: bash
        run: bash scripts/trust_scan.sh

      - uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Fetch Mathlib oleans
        run: |
          if ! lake exe cache get; then
            echo "::error::lake exe cache get failed; stopping before Mathlib would compile from source"
            exit 1
          fi

      - name: Build
        run: lake build --wfail

      - name: Kernel audit
        shell: bash
        run: |
          set -euo pipefail
          out="$(lake env lean -DrelaxedAutoImplicit=false Verify.lean 2>&1)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::Verify.lean printed output; a passing audit is silent"
            exit 1
          fi

      - name: Replay the kernel
        run: lake env leanchecker NaturalLatents.Main
